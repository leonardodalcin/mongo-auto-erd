name: Node CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # graphviz provides the `dot` binary used to render the ERD PNG.
          sudo apt-get install -y graphviz
          # mongodb-memory-server downloads MongoDB 4.0.3, which is linked
          # against OpenSSL 1.1. Modern Ubuntu runners ship OpenSSL 3, so we
          # install libssl1.1 to allow the bundled mongod to start.
          curl -fsSL -o /tmp/libssl1.1.deb http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          sudo dpkg -i /tmp/libssl1.1.deb

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build:ts
        env:
          CI: true

      - name: Test
        run: npm test
        env:
          CI: true
